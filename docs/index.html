<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="WaterBuddy: a daily hydration tracker with age-based goals and a mascot that cheers you on.">
<title>WaterBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
/* Layout: the whole screen is the bottle. A fixed sea rises behind frosted panels as you drink. */
:root {
  --bg-top: #F6FCFD; --bg-bottom: #DCEFF4;
  --ink: #08303F; --muted: #3E6B78;
  --lagoon: #4CC3D3; --deep: #0D5770; --sun: #FFC24B; --sun-edge: #D9960B;
  --sea-1: #5FCFDC; --sea-2: #2E9FB3; --sea-3: #0D5770;
  --done-1: #6FD8C8; --done-2: #2FAE9E; --done-3: #0B5A63;
  --glass: rgba(255,255,255,.68); --glass-edge: rgba(255,255,255,.9);
  --field: rgba(255,255,255,.85); --field-edge: rgba(13,87,112,.2);
  --track: rgba(13,87,112,.12); --rule: rgba(13,87,112,.12);
  --bubble: #FFFFFF; --shadow: rgba(8,48,63,.35);
  --btn-ink: #FFFFFF;
  --font: 'Bricolage Grotesque', 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg-top: #061821; --bg-bottom: #0A2733;
  --ink: #E4F6F9; --muted: #9CC4CE;
  --lagoon: #5FD3E2; --deep: #8EDCE8;
  --sea-1: #1F7F92; --sea-2: #145E70; --sea-3: #08313E;
  --done-1: #2A9C8C; --done-2: #1D7569; --done-3: #0A3B39;
  --glass: rgba(10,38,50,.62); --glass-edge: rgba(142,220,232,.18);
  --field: rgba(4,24,33,.7); --field-edge: rgba(142,220,232,.25);
  --track: rgba(142,220,232,.16); --rule: rgba(142,220,232,.14);
  --bubble: #0F3443; --shadow: rgba(0,0,0,.55); --btn-ink: #04202A;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg-top: #061821; --bg-bottom: #0A2733;
  --ink: #E4F6F9; --muted: #9CC4CE;
  --lagoon: #5FD3E2; --deep: #8EDCE8;
  --sea-1: #1F7F92; --sea-2: #145E70; --sea-3: #08313E;
  --done-1: #2A9C8C; --done-2: #1D7569; --done-3: #0A3B39;
  --glass: rgba(10,38,50,.62); --glass-edge: rgba(142,220,232,.18);
  --field: rgba(4,24,33,.7); --field-edge: rgba(142,220,232,.25);
  --track: rgba(142,220,232,.16); --rule: rgba(142,220,232,.14);
  --bubble: #0F3443; --shadow: rgba(0,0,0,.55); --btn-ink: #04202A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  font-family: var(--font); font-size: 16px; line-height: 1.45; color: var(--ink);
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed, var(--bg-top);
  min-height: 100vh; overflow-x: hidden;
}
.page {
  position: relative; z-index: 1; max-width: 1120px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}

/* Sea */
.sea {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
  height: calc(var(--level, 5) * 1vh);
  background: linear-gradient(180deg, var(--sea-1) 0%, var(--sea-2) 35%, var(--sea-3) 100%);
  transition: height 1.4s cubic-bezier(.22,1,.36,1);
}
.sea.done { background: linear-gradient(180deg, var(--done-1) 0%, var(--done-2) 35%, var(--done-3) 100%); }
.wave { position: absolute; left: 0; width: 200%; height: 40px; }
.wave path { fill: var(--sea-1); }
.sea.done .wave path { fill: var(--done-1); }
.wave.front { top: -38px; animation: drift 7s linear infinite; }
.wave.back { top: -48px; opacity: .45; animation: drift 11s linear infinite reverse; }
.bub { position: absolute; bottom: -20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
  background: rgba(255,255,255,.12); animation: rise linear infinite; }
@keyframes drift { to { transform: translateX(-50%); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-80vh); opacity: 0 } }

/* Header */
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.brand h1 { margin: 0; font-size: clamp(2.3rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -.035em;
  line-height: 1; font-variation-settings: "opsz" 96; white-space: nowrap; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 1.05rem; }

/* Panels */
.panel { background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
  box-shadow: 0 24px 60px -30px var(--shadow); }
.today { border-radius: 34px; padding: 26px 30px 30px; display: grid; gap: 22px; }
.sub { border-radius: 22px; padding: 22px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; }
.sub > * { min-width: 0; }
h2 { margin: 0 0 10px; font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }

/* Settings row */
.settings { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; align-items: end;
  padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
label { display: block; font-size: .92rem; color: var(--muted); margin-bottom: 6px; }
select, input[type="number"] {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--field);
  border: 1.5px solid var(--field-edge); border-radius: 12px; padding: 10px 12px; min-height: 46px;
}
select:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.standard { font-size: 1rem; line-height: 1.5; padding-bottom: 4px; }
.standard b { font-variant-numeric: tabular-nums; }

/* Main split */
.split { display: grid; grid-template-columns: 1fr 1.45fr; gap: 32px; align-items: center; }
.split > * { min-width: 0; }
.mascot { width: 100%; max-width: 230px; display: block; margin: 0 auto; }
.speech { position: relative; background: var(--bubble); border-radius: 22px; padding: 16px 20px; margin-top: 8px;
  font-size: 1.15rem; line-height: 1.4; text-align: center; box-shadow: 0 10px 30px -18px var(--shadow); }
.speech::before { content: ""; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px;
  background: var(--bubble); transform: translateX(-50%) rotate(45deg); border-radius: 3px; }

.readout { font-size: clamp(3.6rem, 10vw, 6.4rem); font-weight: 800; letter-spacing: -.03em; line-height: .9;
  color: var(--deep); font-variation-settings: "opsz" 96; font-variant-numeric: tabular-nums; }
.readout small { font-size: .32em; font-weight: 600; letter-spacing: -.01em; color: var(--muted); margin-left: 6px; }
.of { color: var(--muted); font-size: 1.1rem; margin: 8px 0 16px; }
.of b { color: var(--ink); }
.bar { position: relative; height: 14px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--lagoon), var(--sea-3));
  transition: width .9s cubic-bezier(.22,1,.36,1); }
.tick { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
  background: var(--glass-edge); border: 2px solid var(--field-edge); }
.tick.on { background: var(--sun); border-color: var(--sun-edge); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 14px 0 20px; color: var(--muted); }
.stats b { font-size: 1.35rem; color: var(--ink); font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }

/* Buttons */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button { font: inherit; cursor: pointer; }
.btn { min-height: 48px; border-radius: 16px; font-weight: 600; font-size: 1rem; color: var(--ink);
  background: var(--field); border: 1.5px solid var(--field-edge); transition: border-color .15s, transform .1s; }
.btn:hover { border-color: var(--deep); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.primary { grid-column: 1 / -1; min-height: 66px; border: none; border-radius: 22px; font-size: 1.25rem; font-weight: 700;
  color: #fff; background: linear-gradient(135deg, #39B5C7, #0D5770); box-shadow: 0 14px 30px -14px rgba(13,87,112,.85); }
.primary:hover { filter: brightness(1.06); }
details { grid-column: 1 / -1; border: 1.5px solid var(--field-edge); border-radius: 16px; background: var(--field); }
summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
.custom { display: grid; grid-template-columns: 1.3fr 1fr auto; gap: 10px; padding: 0 14px 14px; align-items: end; }
.custom .btn { padding: 0 18px; }
.err { grid-column: 1 / -1; margin: 0; color: #B4462F; font-size: .92rem; }

/* Compare + log */
.cmp { margin: 12px 0; }
.cmp-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
.cmp-row b { font-variant-numeric: tabular-nums; }
.cmp-track { height: 12px; border-radius: 99px; background: var(--track); overflow: hidden; }
.cmp-track div { height: 100%; border-radius: 99px; transition: width .8s ease; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.log li span { color: var(--muted); }
.empty { color: var(--muted); margin: 6px 0 0; }
.summary { grid-column: 1 / -1; margin: 0; padding: 14px 18px; border-radius: 16px; background: var(--field);
  border: 1.5px solid var(--done-1); }

/* Tips + converter */
.tip { font-size: 1.08rem; line-height: 1.5; padding: 14px 18px; border-radius: 16px; background: var(--bubble);
  border-left: 5px solid var(--sun); margin-bottom: 12px; min-height: 4.6em; }
.conv { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.conv .eq { padding-bottom: 12px; font-weight: 700; color: var(--muted); }
.note { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }

/* Celebration */
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.drop { position: absolute; bottom: -30px; width: 14px; height: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  animation: pop 2.4s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes pop { 0% { transform: translateY(0) scale(.6); opacity: 1 } 100% { transform: translateY(-95vh) scale(1); opacity: 0 } }

@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@keyframes jump { 0%,100% { transform: translateY(0) } 45% { transform: translateY(-16px) } }
@keyframes arm { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-20deg) } }
.wave-arm { transform-origin: 146px 124px; animation: arm .8s ease-in-out infinite; }

@media (max-width: 820px) {
  .settings { grid-template-columns: 1fr 1fr; }
  .standard { grid-column: 1 / -1; }
  .split { grid-template-columns: 1fr; gap: 20px; }
  .sub { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .today { padding: 20px 16px 22px; border-radius: 26px; }
  .sub { padding: 18px 16px; }
  .settings { grid-template-columns: 1fr; }
  .custom { grid-template-columns: 1fr 1fr; }
  .custom .btn { grid-column: 1 / -1; }
  .mascot { max-width: 170px; }
}
@media (prefers-reduced-motion: reduce) {
  .sea, .bar-fill, .cmp-track div { transition: none; }
  .wave, .bub, .mascot g, .wave-arm, .drop { animation: none !important; }
  .bub, .burst { display: none; }
}
</style>
</head>
<body>

<div class="sea" id="sea" aria-hidden="true">
  <svg class="wave back" viewBox="0 0 1200 80" preserveAspectRatio="none"><path d="M0 30 Q 75 0 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30 V 80 H 0 Z"/></svg>
  <svg class="wave front" viewBox="0 0 1200 80" preserveAspectRatio="none"><path d="M0 30 Q 75 0 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30 V 80 H 0 Z"/></svg>
</div>
<div class="burst" id="burst" aria-hidden="true"></div>

<main class="page">
  <header class="brand">
    <h1>💧 WaterBuddy</h1>
    <p>Fill the screen. Fill yourself up.</p>
  </header>

  <section class="panel today" aria-label="Today's hydration">
    <div class="settings">
      <div>
        <label for="age">Your age group</label>
        <select id="age"></select>
      </div>
      <div>
        <label for="goal">Daily goal (ml)</label>
        <input id="goal" type="number" min="500" max="6000" step="100" inputmode="numeric">
      </div>
      <div class="standard" id="standard"></div>
    </div>

    <div class="split">
      <div>
        <div id="mascot"></div>
        <div class="speech" id="speech" aria-live="polite"></div>
      </div>
      <div>
        <div class="readout" id="readout" aria-live="polite">0<small>ml</small></div>
        <div class="of" id="of"></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar">
          <div class="bar-fill" id="barFill"></div>
          <span class="tick" style="left:25%"></span><span class="tick" style="left:50%"></span><span class="tick" style="left:75%"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="actions">
          <button class="primary" id="glass" type="button">🥤 Drink a glass +250 ml</button>
          <button class="btn" id="sip" type="button">Sip +100 ml</button>
          <button class="btn" id="bottle" type="button">Bottle +500 ml</button>
          <details>
            <summary>Log a different amount</summary>
            <form class="custom" id="customForm" novalidate>
              <div>
                <label for="amount">Amount</label>
                <input id="amount" type="number" min="0" step="50" placeholder="e.g. 330" inputmode="decimal">
              </div>
              <div>
                <label for="unit">Unit</label>
                <select id="unit"><option value="ml">ml</option><option value="cups">cups</option></select>
              </div>
              <button class="btn" type="submit">Add drink</button>
              <p class="err" id="err" hidden>Enter an amount above 0 to add a drink.</p>
            </form>
          </details>
          <button class="btn" id="undo" type="button">↩ Undo last drink</button>
          <button class="btn" id="reset" type="button">Start a new day</button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel sub" aria-label="Today in detail">
    <div>
      <h2>How you compare</h2>
      <div id="compare"></div>
    </div>
    <div>
      <h2>Today's drinks</h2>
      <div id="log"></div>
    </div>
    <p class="summary" id="summary" hidden></p>
  </section>

  <section class="panel sub" aria-label="Tips and tools">
    <div>
      <h2>💡 Tip for today</h2>
      <div class="tip" id="tip"></div>
      <button class="btn" id="nextTip" type="button" style="width:100%">Show another tip</button>
    </div>
    <div>
      <h2>Cups and ml</h2>
      <div class="conv">
        <div><label for="cups">Cups</label><input id="cups" type="number" min="0" step="0.5" value="2" inputmode="decimal"></div>
        <div class="eq">=</div>
        <div><label for="ml">Millilitres</label><input id="ml" type="number" min="0" step="50" value="500" inputmode="numeric"></div>
      </div>
      <p class="note">1 cup = 250 ml. Your drinks stay in this browser only. Nothing is sent anywhere.</p>
    </div>
  </section>
</main>

<script>
(() => {
  const ML_PER_CUP = 250, QUICK = 250, KEY = 'waterbuddy-v1';
  const AGES = {
    'Kids (6–12)':          { goal: 1600, emoji: '🧒', tone: 'kid' },
    'Teens (13–18)':        { goal: 2100, emoji: '🧑', tone: 'teen' },
    'Adults (19–50)':       { goal: 2500, emoji: '🧑‍💼', tone: 'adult' },
    'Older adults (51–64)': { goal: 2400, emoji: '🧑‍🦳', tone: 'adult' },
    'Seniors (65+)':        { goal: 2000, emoji: '👴', tone: 'senior' },
  };
  const MESSAGES = {
    kid:    { 0: "Hi friend! Let's fill up the screen with water today!", 25: "Yay, a quarter done! You're a water hero!", 50: "WOW, halfway there! Your body says thank you!", 75: "Almost there, superstar! Just a few more sips!", 100: "You did it! Hydration champion of the day! 🏆" },
    teen:   { 0: "New day, empty tank. Let's get that first glass in.", 25: "25% done. Nice start, keep it rolling.", 50: "Great! You reached 50%. Halfway there 🔥", 75: "75%. The finish line's right there.", 100: "Goal smashed! Your brain and body thank you 🙌" },
    adult:  { 0: "Good to see you. Start with a glass of water.", 25: "Nice, 25% of your goal done. Keep the habit going.", 50: "Great! You reached 50% of today's goal.", 75: "75% there. One or two more glasses should do it.", 100: "Daily goal reached. Great job today ✅" },
    senior: { 0: "Hello! A small glass of water is a lovely way to begin.", 25: "Well done, a quarter of your goal is complete.", 50: "Wonderful, you're halfway there. Keep sipping gently.", 75: "Nearly done, just a little more for today.", 100: "Goal reached! Excellent care for yourself today 🌼" },
  };
  const TIPS = [
    "Start your day with a glass of water before your first chai or coffee.",
    "Keep a bottle on your desk. You drink more when it's in sight.",
    "Feeling hungry between meals? Sometimes it's actually thirst.",
    "Watermelon, oranges and cucumber count towards hydration too.",
    "Drink a glass before and after a workout, plus sips during.",
    "Pale yellow urine is a good sign you're well hydrated.",
    "Hot day? Add an extra 500 ml to your goal.",
    "Small sips every hour beat one huge gulp at night.",
    "Bored of plain water? Add lemon, mint or cucumber slices.",
    "Headaches and tiredness can be early signs of dehydration.",
  ];

  // ---------- calculations ----------
  const today = () => new Date().toLocaleDateString('en-CA');
  const total = log => log.reduce((s, d) => s + d.ml, 0);
  const remaining = (intake, goal) => Math.max(0, goal - intake);
  const percent = (intake, goal) => goal > 0 ? Math.round(intake / goal * 1000) / 10 : 0;
  const milestone = p => [100, 75, 50, 25].find(m => p >= m) ?? 0;
  const glassesLeft = r => Math.ceil(r / QUICK);
  const mlToCups = ml => Math.round(ml / ML_PER_CUP * 100) / 100;
  const cupsToMl = c => Math.round(c * ML_PER_CUP);
  const seaLevel = p => 5 + 95 * Math.min(p, 100) / 100;
  const fmt = n => n.toLocaleString('en-IN');

  // ---------- state (kept in this browser only) ----------
  const fresh = () => ({ age: 'Teens (13–18)', goal: 2100, log: [], day: today(), celebrated: false });
  let state = fresh();
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.age in AGES) state = { ...state, ...saved }; } catch (e) {}
  if (state.day !== today()) state = { ...state, log: [], day: today(), celebrated: false };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const $ = id => document.getElementById(id);

  // ---------- mascot ----------
  function mascot(stage) {
    const ink = '#08303F', arm = 'stroke="#2E9FB3" stroke-width="9" fill="none" stroke-linecap="round"';
    const mouths = {
      0: `<path d="M88 134 Q100 138 112 134" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
      25: `<path d="M85 130 Q100 143 115 130" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
      50: `<path d="M83 128 Q100 151 117 128 Z" fill="${ink}"/>`,
      75: `<path d="M81 126 Q100 155 119 126 Z" fill="${ink}"/><path d="M91 139 Q100 148 109 139 Z" fill="#FF8A7A"/>`,
      100: `<path d="M79 124 Q100 162 121 124 Z" fill="${ink}"/><path d="M89 140 Q100 154 111 140 Z" fill="#FF8A7A"/>`,
    };
    const eyes = stage === 100
      ? `<path d="M78 106 Q86 96 94 106" stroke="${ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M106 106 Q114 96 122 106" stroke="${ink}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`
      : `<circle cx="86" cy="106" r="7.5" fill="${ink}"/><circle cx="114" cy="106" r="7.5" fill="${ink}"/><circle cx="88.5" cy="103" r="2.6" fill="#fff"/><circle cx="116.5" cy="103" r="2.6" fill="#fff"/>`;
    let arms, motion;
    if (stage >= 75) { arms = `<path d="M54 122 Q34 98 42 72" ${arm}/><path d="M146 122 Q166 98 158 72" ${arm}/>`; motion = 'jump .9s ease-in-out infinite'; }
    else if (stage >= 25) { arms = `<path d="M54 132 Q42 142 44 158" ${arm}/><g class="wave-arm"><path d="M146 124 Q168 106 162 84" ${arm}/></g>`; motion = 'bob 2.2s ease-in-out infinite'; }
    else { arms = `<path d="M54 132 Q42 142 44 158" ${arm}/><path d="M146 132 Q158 142 156 158" ${arm}/>`; motion = 'bob 3.2s ease-in-out infinite'; }
    const blush = stage >= 50 ? '<ellipse cx="73" cy="124" rx="8" ry="5" fill="#FF8A7A" opacity=".55"/><ellipse cx="127" cy="124" rx="8" ry="5" fill="#FF8A7A" opacity=".55"/>' : '';
    const crown = stage === 100 ? '<path d="M78 30 L86 12 L100 25 L114 12 L122 30 Z" fill="#FFC24B" stroke="#D9960B" stroke-width="2.5" stroke-linejoin="round"/>' : '';
    return `<svg class="mascot" viewBox="0 0 200 200" role="img" aria-label="Drippy the water drop, ${stage}% milestone">
      <g style="animation:${motion};transform-origin:100px 180px">${arms}
      <path d="M100 22 C100 22 46 94 46 130 A54 54 0 0 0 154 130 C154 94 100 22 100 22 Z" fill="#8EE0EA" stroke="#0D5770" stroke-width="4"/>
      <path d="M70 90 Q66 112 74 128" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".55"/>
      ${crown}${eyes}${blush}${mouths[stage]}</g></svg>`;
  }

  // ---------- render ----------
  let lastStage = -1;
  function render() {
    const group = AGES[state.age], standard = group.goal, goal = state.goal;
    const intake = total(state.log), rem = remaining(intake, goal), pct = percent(intake, goal), stage = milestone(pct);

    $('age').value = state.age;
    if (document.activeElement !== $('goal')) $('goal').value = goal;
    const diff = goal - standard;
    $('standard').innerHTML = `${group.emoji} Standard for your age is <b>${fmt(standard)} ml</b><br>` +
      (diff ? `Your goal is ${fmt(Math.abs(diff))} ml ${diff > 0 ? 'above' : 'below'} it` : 'Your goal matches it ✅');

    if (stage !== lastStage) { $('mascot').innerHTML = mascot(stage); lastStage = stage; }
    $('speech').textContent = MESSAGES[group.tone][stage];

    $('readout').innerHTML = `${fmt(intake)}<small>ml</small>`;
    $('of').innerHTML = `of your <b>${fmt(goal)} ml</b> goal today`;
    $('barFill').style.width = Math.min(pct, 100) + '%';
    $('bar').setAttribute('aria-valuenow', Math.round(Math.min(pct, 100)));
    document.querySelectorAll('.tick').forEach((t, i) => t.classList.toggle('on', pct >= (i + 1) * 25));
    const g = glassesLeft(rem);
    $('stats').innerHTML = `<span><b>${Math.round(pct)}%</b>done</span><span><b>${fmt(rem)} ml</b>to go</span><span><b>${g}</b>${g === 1 ? 'glass' : 'glasses'} left</span>`;
    $('undo').disabled = !state.log.length;

    $('sea').style.setProperty('--level', seaLevel(pct));
    $('sea').classList.toggle('done', pct >= 100);

    const top = Math.max(intake, goal, standard, 1);
    $('compare').innerHTML = [['You today', intake, 'var(--lagoon)'], ['Your goal', goal, 'var(--sea-3)'], ['Standard for your age', standard, 'var(--muted)']]
      .map(([l, v, c]) => `<div class="cmp"><div class="cmp-row"><span>${l}</span><b>${fmt(v)} ml</b></div><div class="cmp-track"><div style="width:${(v / top * 100).toFixed(1)}%;background:${c}"></div></div></div>`).join('');

    if (state.log.length) {
      const items = state.log.slice(-6).reverse().map(d => `<li><span>${d.t}</span><b>+${fmt(d.ml)} ml</b></li>`).join('');
      const more = state.log.length > 6 ? `<p class="empty">Plus ${state.log.length - 6} earlier drinks</p>` : '';
      $('log').innerHTML = `<ul class="log">${items}</ul>${more}`;
    } else {
      $('log').innerHTML = '<p class="empty">No drinks yet. Tap “Drink a glass” to start filling the screen.</p>';
    }

    const sum = $('summary');
    sum.hidden = stage !== 100;
    if (stage === 100) sum.textContent = `🏁 Day complete: ${fmt(intake)} ml (${mlToCups(intake)} cups) over ${state.log.length} drinks, ${Math.round(pct)}% of your goal. Tap “Start a new day” tomorrow morning.`;

    if (stage === 100 && !state.celebrated) { state.celebrated = true; celebrate(); }
    save();
  }

  function celebrate() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const b = $('burst'), colors = ['#4CC3D3', '#8EE0EA', '#FFC24B', '#2FAE9E', '#5FCFDC'];
    for (let i = 0; i < 36; i++) {
      const d = document.createElement('span');
      d.className = 'drop';
      d.style.left = Math.random() * 100 + '%';
      d.style.background = colors[i % colors.length];
      d.style.animationDelay = (Math.random() * 0.6) + 's';
      d.style.transform = `scale(${0.6 + Math.random()})`;
      b.appendChild(d);
      setTimeout(() => d.remove(), 3400);
    }
  }

  // ---------- actions ----------
  const time = () => new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
  function logWater(ml) {
    if (ml <= 0) return;
    if (state.day !== today()) state = { ...state, log: [], day: today(), celebrated: false };
    state.log.push({ t: time(), ml });
    render();
  }

  $('age').innerHTML = Object.keys(AGES).map(a => `<option>${a}</option>`).join('');
  $('age').addEventListener('change', e => { state.age = e.target.value; state.goal = AGES[state.age].goal; render(); });
  $('goal').addEventListener('change', e => {
    const v = Math.round(Number(e.target.value));
    state.goal = Math.min(6000, Math.max(500, Number.isFinite(v) && v > 0 ? v : AGES[state.age].goal));
    e.target.value = state.goal;
    if (percent(total(state.log), state.goal) < 100) state.celebrated = false;
    render();
  });
  $('glass').addEventListener('click', () => logWater(QUICK));
  $('sip').addEventListener('click', () => logWater(100));
  $('bottle').addEventListener('click', () => logWater(500));
  $('customForm').addEventListener('submit', e => {
    e.preventDefault();
    const amt = Number($('amount').value);
    const ml = $('unit').value === 'cups' ? cupsToMl(amt) : Math.round(amt);
    if (!(ml > 0)) { $('err').hidden = false; return; }
    $('err').hidden = true; $('amount').value = '';
    logWater(ml);
  });
  $('undo').addEventListener('click', () => { state.log.pop(); state.celebrated = false; render(); });
  $('reset').addEventListener('click', () => { state.log = []; state.day = today(); state.celebrated = false; newTip(); render(); });

  function newTip() {
    const cur = $('tip').textContent;
    const pool = TIPS.filter(t => t !== cur);
    $('tip').textContent = pool[Math.floor(Math.random() * pool.length)];
  }
  $('nextTip').addEventListener('click', newTip);

  $('cups').addEventListener('input', e => { const c = Number(e.target.value); $('ml').value = c >= 0 ? cupsToMl(c) : ''; });
  $('ml').addEventListener('input', e => { const m = Number(e.target.value); $('cups').value = m >= 0 ? mlToCups(m) : ''; });

  // bubbles in the sea
  [[8, 10, 0, 9], [19, 6, 3, 7], [33, 14, 1.5, 11], [47, 8, 5, 8], [61, 12, 2, 10], [74, 6, 4, 7], [86, 16, .5, 12], [94, 8, 6, 9]]
    .forEach(([x, s, d, t]) => {
      const b = document.createElement('span');
      b.className = 'bub';
      Object.assign(b.style, { left: x + '%', width: s + 'px', height: s + 'px', animationDelay: d + 's', animationDuration: t + 's' });
      $('sea').appendChild(b);
    });

  // reset automatically if the page stays open past midnight
  setInterval(() => { if (state.day !== today()) { state = { ...state, log: [], day: today(), celebrated: false }; render(); } }, 60000);

  newTip();
  render();
})();
</script>

</body>
</html>
